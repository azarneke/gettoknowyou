<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getting to Know You</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      height: fit-content;
    }
    h1 { margin-top: 0; color: #1a1a1a; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 500; margin-bottom: 0.4rem; color: #333; }
    input, textarea {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: white;
    }
    textarea { resize: vertical; min-height: 90px; }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .success { background: #e6f4ea; color: #137333; display: block; }
    .error   { background: #fce8e6; color: #c5221f; display: block; }
    .info    { background: #e8f0fe; color: #1967d2; display: block; }
    .ai-badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1967d2;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      margin-left: 0.4rem;
      font-weight: 500;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Getting to Know You</h1>
  <p class="subtitle">Five quick questions. Just the basics.</p>

  <form id="surveyForm">
    <label for="name">1. What is your name?</label>
    <input type="text" id="name" name="name" required placeholder="Your name">

    <label for="favoriteColor">2. What is your favorite color?</label>
    <input type="text" id="favoriteColor" name="favoriteColor" required placeholder="e.g. Blue, Green, Purple">

    <label for="favoriteSport">3. What is your favorite sport?</label>
    <input type="text" id="favoriteSport" name="favoriteSport" required placeholder="e.g. Basketball, Soccer, Swimming">

    <label for="favoriteFood">4. What is your favorite food?</label>
    <input type="text" id="favoriteFood" name="favoriteFood" required placeholder="e.g. Pizza, Sushi, Tacos">

    <label for="hobbies">
      5. What are your hobbies?
      <span class="ai-badge">AI-analyzed</span>
    </label>
    <textarea id="hobbies" name="hobbies" required placeholder="Tell me about what you love to do..."></textarea>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // ============================================================
  // CONFIGURATION
  // Only ONE value needed here — the Apps Script Web App URL.
  // The Gemini API key lives in Apps Script, not in this file.
  // ============================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVDeBW7b4DAHmN7TYRSMN_S8m6_aTFdFfjGlu2UxMK0npKFs5-hxS4JFQdu8nxoIBL/exec';
  // ============================================================

  const form = document.getElementById('surveyForm');
  const statusDiv = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  function showStatus(message, type) {
    statusDiv.textContent = message;
    statusDiv.className = type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    showStatus('Submitting your answers...', 'info');

    const formData = new FormData(form);
    const data = {
      timestamp:     new Date().toISOString(),
      name:          formData.get('name'),
      favoriteColor: formData.get('favoriteColor'),
      favoriteSport: formData.get('favoriteSport'),
      favoriteFood:  formData.get('favoriteFood'),
      hobbies:       formData.get('hobbies')
    };

    try {
      // text/plain avoids a CORS preflight with Apps Script
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (result.result === 'success') {
        showStatus(
          `✓ Thanks, ${data.name}! Your answers were saved.\n\n` +
          `AI insight on your hobbies: ${result.aiInsight || '(none)'}`,
          'success'
        );
        form.reset();
      } else {
        showStatus('Server error: ' + (result.message || 'unknown'), 'error');
      }

    } catch (err) {
      showStatus('Could not submit. ' + err.message, 'error');
    }

    submitBtn.disabled = false;
  });
</script>

</body>
</html>
