<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getting to Know You</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      max-width: 620px;
      width: 100%;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      height: fit-content;
    }
    h1 { margin-top: 0; color: #1a1a1a; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 500; margin-bottom: 0.4rem; color: #333; }
    input, textarea {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: white;
    }
    textarea { resize: vertical; min-height: 90px; }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #1557b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }

    .btn-secondary {
      background: white;
      color: #1a73e8;
      border: 1px solid #1a73e8;
      margin-top: 0.6rem;
    }
    .btn-secondary:hover:not(:disabled) { background: #f0f5ff; }

    #status {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .success { background: #e6f4ea; color: #137333; display: block; }
    .error   { background: #fce8e6; color: #c5221f; display: block; }
    .info    { background: #e8f0fe; color: #1967d2; display: block; }

    .ai-badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1967d2;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      margin-left: 0.4rem;
      font-weight: 500;
      vertical-align: middle;
    }

    /* ---- Insight panel ---- */
    .insight-panel {
      margin-top: 1rem;
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .insight-panel.visible { display: block; }

    .insight-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1967d2;
      margin: 1rem 0 0.5rem 0;
    }
    .insight-section-title:first-child { margin-top: 0; }

    .qa-item {
      padding: 0.75rem 1rem;
      background: #f8f9ff;
      border-left: 3px solid #c9d9ff;
      border-radius: 6px;
      margin-bottom: 0.6rem;
    }
    .qa-question {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.25rem;
    }
    .qa-answer {
      font-size: 0.9rem;
      color: #1a1a1a;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    .qa-analysis {
      font-size: 0.875rem;
      color: #1967d2;
      line-height: 1.5;
    }

    .overall-card {
      padding: 1rem 1.1rem;
      background: #eef3ff;
      border-left: 3px solid #1a73e8;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.55;
      color: #1a1a1a;
      white-space: pre-wrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Getting to Know You</h1>
  <p class="subtitle">Five quick questions. Just the basics.</p>

  <form id="surveyForm">
    <label for="name">1. What is your name?</label>
    <input type="text" id="name" name="name" required placeholder="Your name">

    <label for="favoriteColor">2. What is your favorite color?</label>
    <input type="text" id="favoriteColor" name="favoriteColor" required placeholder="e.g. Blue, Green, Purple">

    <label for="favoriteSport">3. What is your favorite sport?</label>
    <input type="text" id="favoriteSport" name="favoriteSport" required placeholder="e.g. Basketball, Soccer, Swimming">

    <label for="favoriteFood">4. What is your favorite food?</label>
    <input type="text" id="favoriteFood" name="favoriteFood" required placeholder="e.g. Pizza, Sushi, Tacos">

    <label for="hobbies">
      5. What are your hobbies?
      <span class="ai-badge">AI-analyzed</span>
    </label>
    <textarea id="hobbies" name="hobbies" required placeholder="Tell me about what you love to do..."></textarea>

    <button type="submit" id="submitBtn">Submit</button>

    <button type="button" id="insightBtn" class="btn-secondary" disabled>
      Show my AI analysis
    </button>
  </form>

  <div id="status"></div>

  <!-- AI insight panel: per-question + overall -->
  <div id="insightPanel" class="insight-panel">
    <div class="insight-section-title">Question-by-question analysis</div>
    <div id="perQuestionContainer"></div>

    <div class="insight-section-title">Overall summary</div>
    <div class="overall-card" id="overallText"></div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURATION
  // The Gemini API key lives in Apps Script — never in this file.
  // ============================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVDeBW7b4DAHmN7TYRSMN_S8m6_aTFdFfjGlu2UxMK0npKFs5-hxS4JFQdu8nxoIBL/exec';
  // ============================================================

  const form                = document.getElementById('surveyForm');
  const statusDiv           = document.getElementById('status');
  const submitBtn           = document.getElementById('submitBtn');
  const insightBtn          = document.getElementById('insightBtn');
  const insightPanel        = document.getElementById('insightPanel');
  const perQuestionContainer= document.getElementById('perQuestionContainer');
  const overallText         = document.getElementById('overallText');

  // Keep the last submission so the analysis button can reuse it
  let lastSubmission = null;

  // Friendly labels for the questions (used in the analysis card)
  const QUESTION_LABELS = {
    name:          'Name',
    favoriteColor: 'Favorite color',
    favoriteSport: 'Favorite sport',
    favoriteFood:  'Favorite food',
    hobbies:       'Hobbies'
  };

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showStatus(message, type) {
    statusDiv.textContent = message;
    statusDiv.className = type;
  }

  function hideInsightPanel() {
    insightPanel.classList.remove('visible');
    perQuestionContainer.innerHTML = '';
    overallText.textContent = '';
  }

  // ------------------------------------------------------------
  // SUBMIT — saves the raw answers to the sheet
  // ------------------------------------------------------------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    insightBtn.disabled = true;
    hideInsightPanel();
    showStatus('Submitting your answers...', 'info');

    const formData = new FormData(form);
    const data = {
      action:        'submit',
      timestamp:     new Date().toISOString(),
      name:          formData.get('name'),
      favoriteColor: formData.get('favoriteColor'),
      favoriteSport: formData.get('favoriteSport'),
      favoriteFood:  formData.get('favoriteFood'),
      hobbies:       formData.get('hobbies')
    };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (result.result === 'success') {
        showStatus(`✓ Thanks, ${data.name}! Your answers were saved.`, 'success');
        lastSubmission = data;
        insightBtn.disabled = false;
      } else {
        showStatus('Server error: ' + (result.message || 'unknown'), 'error');
      }
    } catch (err) {
      showStatus('Could not submit. ' + err.message, 'error');
    }

    submitBtn.disabled = false;
  });

  // ------------------------------------------------------------
  // SHOW ANALYSIS — per-question + overall
  // ------------------------------------------------------------
  insightBtn.addEventListener('click', async () => {
    if (!lastSubmission) return;

    // Toggle off if already visible
    if (insightPanel.classList.contains('visible')) {
      hideInsightPanel();
      insightBtn.textContent = 'Show my AI analysis';
      return;
    }

    insightBtn.disabled = true;
    insightBtn.textContent = 'Analyzing...';

    // Show loading placeholder
    insightPanel.classList.add('visible');
    perQuestionContainer.innerHTML =
      '<div class="qa-item"><div class="qa-analysis">' +
      '<span class="loading-dots">Analyzing each answer</span>' +
      '</div></div>';
    overallText.innerHTML = '<span class="loading-dots">Writing summary</span>';

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action:        'analyze',
          name:          lastSubmission.name,
          favoriteColor: lastSubmission.favoriteColor,
          favoriteSport: lastSubmission.favoriteSport,
          favoriteFood:  lastSubmission.favoriteFood,
          hobbies:       lastSubmission.hobbies
        })
      });

      const result = await response.json();

      if (result.result === 'success') {
        renderAnalysis(result.analyses || [], result.overall || '');
        insightBtn.textContent = 'Hide my AI analysis';
      } else {
        perQuestionContainer.innerHTML =
          '<div class="qa-item"><div class="qa-analysis">Error: ' +
          escapeHtml(result.message || 'unknown') + '</div></div>';
        overallText.textContent = '';
        insightBtn.textContent = 'Try again';
      }
    } catch (err) {
      perQuestionContainer.innerHTML =
        '<div class="qa-item"><div class="qa-analysis">Could not get analysis: ' +
        escapeHtml(err.message) + '</div></div>';
      overallText.textContent = '';
      insightBtn.textContent = 'Try again';
    }

    insightBtn.disabled = false;
  });

  // Renders the per-question cards + the overall paragraph
  function renderAnalysis(analyses, overall) {
    perQuestionContainer.innerHTML = '';

    analyses.forEach(item => {
      const card = document.createElement('div');
      card.className = 'qa-item';
      card.innerHTML =
        '<div class="qa-question">' + escapeHtml(QUESTION_LABELS[item.field] || item.field) + '</div>' +
        '<div class="qa-answer">' + escapeHtml(item.answer || '') + '</div>' +
        '<div class="qa-analysis">' + escapeHtml(item.analysis || '') + '</div>';
      perQuestionContainer.appendChild(card);
    });

    overallText.textContent = overall || '(no summary generated)';
  }
</script>

</body>
</html>
